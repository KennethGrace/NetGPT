<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NetGPT</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='none' stroke='%233b82f6' stroke-width='2.5'%3E%3Ccircle cx='16' cy='6' r='3.5'/%3E%3Ccircle cx='6' cy='25' r='3.5'/%3E%3Ccircle cx='26' cy='25' r='3.5'/%3E%3Cpath d='M14 9 8 22M18 9l6 13M9.5 25h13'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <h1>NetGPT</h1>
    <span id="model" class="badge"></span>
    <button id="reset" type="button">New conversation</button>
  </header>
  <main id="conversation" aria-live="polite"></main>
  <form id="composer">
    <div id="status" role="status"></div>
    <div class="row">
      <textarea id="question" rows="1" placeholder="Ask about the network…" autofocus></textarea>
      <button id="send" type="submit">Ask</button>
    </div>
  </form>
</body>
</html>
