# Inventory for the WAN lab in wan.clab.yml.
#
# Passwords never go in this file. Like the other lab, it reads SR Linux's public
# default password from a file outside the repository (chmod 600):
#
#   mkdir -p ~/.config/netgpt && printf 'NokiaSrl1!' > ~/.config/netgpt/srlinux-lab.password
#   chmod 600 ~/.config/netgpt/srlinux-lab.password

credentials:
  srlinux-lab:
    username: admin
    password_file: ~/.config/netgpt/srlinux-lab.password

# containerlab signs each node's API certificate with a per-lab CA.
devices:
  - {name: hq-core,  host: 172.20.21.11, platform: nokia_srlinux, credentials: srlinux-lab, role: core,       tls_ca: clab-wan/.tls/ca/ca.pem}
  - {name: hq-dc,    host: 172.20.21.12, platform: nokia_srlinux, credentials: srlinux-lab, role: datacenter, tls_ca: clab-wan/.tls/ca/ca.pem}
  - {name: hq-sw1,   host: 172.20.21.13, platform: nokia_srlinux, credentials: srlinux-lab, role: access,     tls_ca: clab-wan/.tls/ca/ca.pem}
  - {name: ops-core, host: 172.20.21.21, platform: nokia_srlinux, credentials: srlinux-lab, role: core,       tls_ca: clab-wan/.tls/ca/ca.pem}
  - {name: ops-dc,   host: 172.20.21.22, platform: nokia_srlinux, credentials: srlinux-lab, role: datacenter, tls_ca: clab-wan/.tls/ca/ca.pem}
  - {name: branch,   host: 172.20.21.31, platform: nokia_srlinux, credentials: srlinux-lab, role: branch,     tls_ca: clab-wan/.tls/ca/ca.pem}

# The networks ping_sweep may sweep. The NetGPT host reaches only the management
# network; the rest are swept from a device (ping_sweep with device: hq-core), which
# also fills the ARP and MAC tables the topology reads.
sweep_networks:
  - 172.20.21.0/24
  - 10.0.0.0/24
  - 10.1.0.0/24
  - 10.10.0.0/24
  - 10.10.10.0/24
  - 10.10.100.0/24
  - 10.20.0.0/24
  - 10.20.10.0/24
  - 10.20.100.0/24
  - 10.30.10.0/24
